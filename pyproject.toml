[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-lint"
version = "0.1.0"
description = "Score a README 0-100 and report missing sections and broken links"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "sndryu1" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/sndryu1/readme-lint"

[project.scripts]
readme-lint = "readme_lint:main"

[tool.setuptools]
py-modules = ["readme_lint"]
